<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>O / R / X 可执行动作</title><style>body{margin:0;background:#f3f3f5;color:#0b0b0f;font:16px/1.65 system-ui}main{max-width:1280px;margin:auto;padding:24px}h1{font-size:32px;line-height:1.2}p{color:#555}select,button{font:inherit;padding:8px}iframe{display:block;width:100%;height:810px;border:0;background:white;border-radius:18px}a{color:#34284a}#links{display:grid;grid-template-columns:repeat(auto-fit,minmax(235px,1fr));gap:9px}#links a{padding:10px;background:white;border-radius:8px;text-decoration:none}.toolbar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin:18px 0}.pill{background:#d6c2ff;padding:3px 10px;border-radius:20px}</style><main><h1>实际对象动作与完整源码片段</h1><p>O01–O33 是绑定已有 DOM/SVG 对象的参数化动作；R01–R16 组合为事件过程；X01–X23 沿用原 GSAP 完整时间段。下面的中文内容只用于展示调用方式，换口播时应绑定本期对象、素材与时长。</p><p><a href="../style-film/index.html">完整连续风格示范与认可原片范围 →</a>　<span class="pill">当前 A 材质</span></p><div class="toolbar"><select id="choice"></select><a id="open" target="_blank">单独打开完整片段</a><span id="range"></span></div><iframe title="实际动作播放器" id="player"></iframe><p id="scope"></p><div id="links"></div></main><script src="manifest.js"></script><script>const entries=SemanticEffectManifest.effects,choice=document.querySelector('#choice');function url(e){return e.kind==='source-timeline'?'source-timelines/'+e.source_group+'.html?effect='+e.id+'&controls=1':'demo.html?effect='+e.id}function show(id){const e=entries.find(x=>x.id===id)||entries[0];choice.value=e.id;player.src=url(e);document.querySelector('#open').href=url(e);document.querySelector('#range').textContent=e.kind==='source-timeline'?'完整区间 '+e.source_range.join('–')+' s':'可绑定任意本期对象 · 示例 6 s';document.querySelector('#scope').textContent=e.semantic_use;history.replaceState(null,'','#'+e.id)}entries.forEach(e=>{const o=document.createElement('option');o.value=e.id;o.textContent=e.id+' '+e.title;choice.append(o);const a=document.createElement('a');a.href='#'+e.id;a.textContent=o.textContent;a.onclick=()=>show(e.id);document.querySelector('#links').append(a)});choice.onchange=()=>show(choice.value);show(location.hash.slice(1)||'O01');</script></html>

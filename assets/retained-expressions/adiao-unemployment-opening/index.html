<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>保留的开头动作 · 本期素材绑定</title><style>@font-face{font-family:CN;src:url('../../modules/director/assets/studio/fonts/NotoSansSC.ttf');font-weight:100 900}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#eee}canvas#frame{display:block;width:100vw;height:100vh;object-fit:contain}#ui,video{display:none}aside{position:fixed;left:16px;bottom:16px;background:#111;color:#fff;padding:10px;font:16px sans-serif}</style><canvas id="frame" width="1920" height="1080"></canvas><canvas id="ui" width="1920" height="1080"></canvas><video id="presenter" muted preload="auto" playsinline></video><aside id="status"></aside><script src="core.js"></script><script src="opening.js"></script><script>
'use strict';
const bindings=window.__UI_MOTION_BINDINGS__||{},demo=bindings.props?.mode==='demo'||new URLSearchParams(location.search).get('demo')==='1',video=document.getElementById('presenter'),canvas=document.getElementById('frame'),g=canvas.getContext('2d');let time=0;
window.__UI_MOTION_BINDINGS__={...bindings,props:{...bindings.props,mode:demo?'demo':'production'}};window.duration=7.4;window.project={width:1920,height:1080,duration:7.4,fps:50};
function mediaReady(predicate,event){if(predicate())return Promise.resolve();return new Promise((resolve,reject)=>{const finish=()=>{if(predicate()){clearTimeout(timer);video.removeEventListener(event,finish);resolve()}},timer=setTimeout(()=>reject(Error('Current presenter media not ready')),20000);video.addEventListener(event,finish);video.addEventListener('error',()=>reject(Error('Current presenter media decode failed')),{once:true});finish()})}
window.ready=()=>window._ready||(window._ready=(async()=>{if(!demo){const required=['source/current-presenter.mp4','assets/current-product.svg'],absent=required.filter(k=>!bindings.media?.[k]);if(absent.length)throw Error('Provide current media bindings: '+absent.join(', '));video.src='source/current-presenter.mp4';video.load();await mediaReady(()=>video.readyState>=2,'loadeddata');if(video.duration<7.4)throw Error('Presenter must cover the opening duration');}await B.ready();document.getElementById('status').hidden=true;return true;})());
function actor(t){g.fillStyle='#F4F4F6';g.fillRect(0,0,1920,1080);g.fillStyle='#17171A';g.beginPath();g.ellipse(605,310,125,140,0,0,Math.PI*2);g.fill();g.beginPath();g.roundRect(350,450,520,690,145);g.fill();g.fillRect(295,535+Math.sin(t)*10,90,355);g.fillStyle='#D6C2FF';g.fillRect(535,500,140,9);g.font='30px CN';g.fillStyle='#777780';g.fillText('示意人物区 · 制作时替换为本期人物',60,75);}
window.seek=async t=>{await window.ready();time=Math.max(0,Math.min(7.399,t));if(demo)actor(time);else{if(Math.abs(video.currentTime-time)>.0001){video.currentTime=time;await mediaReady(()=>!video.seeking,'seeked')}g.drawImage(video,0,0,1920,1080);}B.g.clearRect(0,0,1920,1080);window.drawOpening(time);const c=B.captions.find(c=>time>=c.start&&time<c.end);if(c){B.g.font='700 42px CN';const w=B.g.measureText(c.text).width;B.box(1010-w/2-27,978,w+54,70,B.C.ink,12);B.text(c.text,1010,1026,42,B.C.white,700,'center')}g.drawImage(document.getElementById('ui'),0,0);return {time,demo}};window.render=window.seek;window.getState=()=>({time,demo,duration:7.4});
if(!new URLSearchParams(location.search).has('render'))window.ready().then(()=>{let start;const loop=async now=>{start??=now;await window.seek((now-start)/1000%7.4);requestAnimationFrame(loop)};requestAnimationFrame(loop)}).catch(e=>document.getElementById('status').textContent=e.message);
</script></html>

<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>独立实现 · 完整动作效果库</title>
<style>
:root{font-family:system-ui,"Microsoft YaHei",sans-serif;color:#0b0b0f;background:#f3f3f5;font-synthesis:none}*{box-sizing:border-box}body{margin:0}button,input{font:inherit}button{cursor:pointer}button:disabled{cursor:wait;opacity:.45}a{color:inherit}header{padding:25px 30px 20px;background:#0b0b0f;color:#fff}header h1{font-size:26px;margin:0 0 10px}header p{max-width:1100px;margin:0;line-height:1.65;color:#dbdbe0;font-size:14px}.badge{display:inline-block;background:#d6c2ff;color:#0b0b0f;border-radius:6px;font-size:13px;padding:3px 8px;vertical-align:middle;margin-left:10px}main{display:grid;grid-template-columns:320px minmax(0,1fr);gap:20px;padding:20px;max-width:1900px;margin:auto}aside,.viewer{background:white;border:1px solid #dbdbe0;border-radius:16px;overflow:hidden}.search-wrap{padding:17px;border-bottom:1px solid #dbdbe0}#search{width:100%;padding:12px;border:1px solid #ccc;border-radius:8px;background:#fafafa;font-size:14px}#list-count{font-size:12px;color:#777780;margin:10px 0 0}#items{height:calc(100vh - 285px);min-height:400px;overflow:auto;padding:7px}.entry{display:block;width:100%;border:0;background:transparent;text-align:left;border-radius:9px;padding:12px;line-height:1.4}.entry:hover{background:#f3f3f5}.entry[aria-current=true]{background:#e9defa;box-shadow:inset 3px 0 #0b0b0f}.entry .entry-title{font-size:14px;font-weight:650}.entry small{display:block;color:#777780;margin-top:6px;font-size:11px}.viewer-head{display:flex;align-items:start;justify-content:space-between;gap:20px;padding:17px 20px}.viewer-head h2{font-size:20px;margin:0 0 8px}.viewer-head p{font-size:12px;margin:0;color:#777780;word-break:break-all}.scope{padding:10px 20px;background:#f5f0fd;font-size:13px;line-height:1.5}.stage{position:relative;width:100%;aspect-ratio:16/9;background:#111116;overflow:hidden}.stage iframe{display:block;width:100%;height:100%;border:0}.stage #loading{position:absolute;inset:0;display:grid;place-items:center;background:#111116;color:#d6c2ff;padding:30px;text-align:center;white-space:pre-wrap}.stage #loading[hidden]{display:none}.controls{padding:15px 20px;border-bottom:1px solid #dbdbe0}.timeline{width:100%;accent-color:#665479;display:block;margin:0 0 14px}.buttons{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.buttons button{border:1px solid #dbdbe0;border-radius:8px;padding:8px 13px;background:#fff;color:#0b0b0f}.buttons #play{background:#0b0b0f;color:#fff;min-width:78px}.buttons label{font-size:12px;color:#777780;margin-left:6px}#time{font-variant-numeric:tabular-nums;font-size:13px;margin-left:auto}#status{font-size:12px;color:#777780;margin-top:9px;line-height:1.5;min-height:18px}.events-wrap{padding:18px 20px}.events-wrap h3{font-size:14px;margin:0 0 12px}.events{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;max-height:300px;overflow:auto}.event{display:block;border:1px solid #dbdbe0;border-radius:9px;padding:10px;text-align:left;background:#fff;font-size:12px;line-height:1.5}.event strong{display:block;color:#665479;margin-bottom:4px}.event[aria-current=true]{border-color:#0b0b0f;background:#f5f0fd}.event span{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden}details{padding:0 20px 18px;font-size:12px;color:#777780}details summary{cursor:pointer}pre{overflow:auto;padding:12px;background:#f3f3f5;color:#0b0b0f;border-radius:8px;white-space:pre-wrap;word-break:break-all}#source-link{white-space:nowrap;font-size:12px}.empty{padding:30px;color:#777780;font-size:14px}@media(max-width:1000px){main{grid-template-columns:240px 1fr;padding:12px;gap:12px}.events{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:720px){header{padding:20px}main{display:flex;flex-direction:column}.search-wrap{padding:12px}#items{height:200px;min-height:0}.viewer-head h2{font-size:17px}.events{grid-template-columns:1fr 1fr}#source-link{display:none}}
</style>
<header><h1>独立实现 · 完整动作效果库 <span id="total" class="badge"></span></h1><p>这里播放的是按完整参考事件独立编写的可执行场景，不是会员原源码或原视频。演示内容只用于看完整动作；不代表新增审美认可。制作时须绑定本期素材、文字和口播时长，沿当前已确认 UI 执行。</p></header>
<main><aside><div class="search-wrap"><input id="search" type="search" placeholder="搜索名称、动作、条目 ID" aria-label="搜索效果"><p id="list-count"></p></div><nav id="items" aria-label="全部独立场景"></nav></aside><section class="viewer"><div class="viewer-head"><div><h2 id="title">选择一个效果</h2><p id="ident"></p></div><a id="source-link" target="_blank" rel="noopener">场景源码 JSON</a></div><div class="scope">完整时长 · 独立实现演示 · 素材位需换成本期内容 · 各条目独立载入，保留各自完整动作</div><div class="stage"><iframe id="player" title="独立场景播放器" allow="autoplay"></iframe><div id="loading">正在准备效果库…</div></div><div class="controls"><input id="timeline" class="timeline" type="range" min="0" max="1" step="0.01" value="0" aria-label="场景时间" disabled><div class="buttons"><button id="previous">上一条</button><button id="play" disabled>播放</button><button id="restart" disabled>重播</button><button id="next">下一条</button><label>外观 <select id="ui-style" aria-label="场景外观"><option value="current">当前认可 UI</option><option value="historic">原独立演示外观（仅对照）</option></select></label><label><input id="autonext" type="checkbox"> 播完切下一条</label><span id="time">0:00 / 0:00</span></div><div id="status" role="status"></div></div><div class="events-wrap"><h3>按完整事件跳转</h3><div id="events" class="events"></div></div><details><summary>本条输入、素材位与调用入口</summary><pre id="bindings"></pre></details></section></main>

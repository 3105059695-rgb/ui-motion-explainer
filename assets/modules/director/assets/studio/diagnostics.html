<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>UI Motion Diagnostics</title><link rel="stylesheet" href="base.css"><style>body{padding:24px}h1{font-size:22px}.checks{font:13px monospace;white-space:pre-wrap;line-height:1.8}.test-mount{position:absolute;left:-10000px;top:0;width:1920px;height:1080px}.contact{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:25px}.sample{background:white;border:1px solid #ddd;border-radius:8px;overflow:hidden}.sample h2{font-size:12px;margin:14px}.sample-view{aspect-ratio:16/9;position:relative;overflow:hidden}.sample-scene{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0}</style></head><body><h1>可定位时间轴与布局检查</h1><button id="run">检查全部预设</button><div id="results" class="checks"></div><div id="contact" class="contact"></div><div id="mount-a" class="test-mount"></div><div id="mount-b" class="test-mount"></div><script src="vendor/gsap.min.js"></script><script src="core.js"></script><script src="presets/effects.js?v=7"></script><script src="presets/software.js?v=7"></script><script src="presets/ambient.js?v=7"></script><script src="presets/components.js?v=7"></script><script src="presets/story.js?v=7"></script><script src="presets/collectui.js?v=7"></script><script src="presets/techtext.js?v=7"></script><script src="presets/transfer.js?v=7"></script><script src="presets/island.js?v=7"></script><script src="presets/workflow.js?v=8"></script><script src="presets/agenthub.js?v=8"></script><script src="presets/automation.js?v=9"></script><script src="presets/reasoning.js?v=9"></script><script src="presets/flowbuilder.js?v=9"></script><script src="presets/invoice.js?v=10"></script><script src="presets/handoff.js?v=10"></script><script src="presets/agentworkflow.js?v=10"></script><script src="presets/scenes.js?v=10"></script><script src="presets/paypalcanvas.js?v=11"></script><script src="presets/logistics.js?v=11"></script><script src="presets/branches.js?v=11"></script><script src="presets/commandblock.js?v=11"></script><script src="presets/codingagent.js?v=12"></script><script src="presets/signalstudio.js?v=12"></script><script src="presets/contextclear.js?v=13"></script><script src="presets/selfcorrect.js?v=14"></script><script src="presets/dnsarticle.js?v=14"></script><script src="presets/chatcanvas.js?v=15"></script><script src="presets/timothyflow.js?v=15"></script><script src="presets/nandasquare.js?v=15"></script><script src="presets/ailkerflow.js?v=16"></script><script src="presets/kreanodes.js?v=16"></script><script src="presets/avdeyflow.js?v=16"></script><script src="presets/jamesflow.js?v=16"></script><script src="presets/loadingstudy.js?v=17"></script><script src="presets/glasssurface.js?v=17"></script><script src="presets/chatcomposer.js?v=17"></script><script src="presets/sidebarcommand.js?v=18"></script><script src="presets/saltcommand.js?v=18"></script><script src="presets/nilscommand.js?v=18"></script><script src="presets/pacocommand.js?v=18"></script><script src="presets/camerastrip.js?v=19"></script><script src="presets/ersadcommand.js?v=21"></script><script src="presets/benjamincommand.js?v=19"></script><script src="presets/supercommand.js?v=22"></script><script src="presets/workflowcontext.js?v=22"></script><script src="presets/emirsearchone.js?v=22"></script><script src="presets/oguzcommand.js?v=22"></script><script src="presets/emirsearchtwo.js?v=22"></script><script src="presets/alvishcommand.js?v=23"></script><script src="presets/solidcommand.js?v=22"></script><script src="presets/jordancommand.js?v=22"></script><script src="presets/producttoursidebar.js?v=24"></script><script src="presets/bbappsidebar.js?v=24"></script><script src="presets/gabriellsidebar.js?v=24"></script><script src="presets/gustavosidebar.js?v=25"></script><script src="presets/jamiesidebar.js?v=25"></script><script src="presets/guerrierosidebar.js?v=25"></script><script src="presets/chmielsidebar.js?v=26"></script><script src="presets/guerrierofilesidebar.js?v=26"></script><script src="presets/ahmetorb.js?v=26"></script><script src="presets/murtabs.js?v=27"></script><script src="presets/dropdownchains.js?v=27"></script><script src="presets/tabstourathas.js?v=27"></script><script src="presets/editortourpiyush.js?v=28"></script><script src="presets/searchmorphrenzo.js?v=28"></script><script src="presets/notificationstack.js?v=28"></script><script src="presets/accordionsetup.js?v=29"></script><script src="presets/tooltipclipshare.js?v=29"></script><script src="presets/emptystatecycle.js?v=29"></script><script src="presets/folderstickerbook.js?v=29"></script><script src="presets/progresssqueeze.js?v=30"></script><script src="presets/switchbear.js?v=30"></script><script src="presets/textnumbers.js?v=30"></script><script src="presets/terminalvillagetour.js?v=30"></script><script>
const reports=[];window.testReport={ready:false,reports};
function equivalent(a,b){if(a===b)return true;if(typeof a!==typeof b||a==null||b==null)return false;if(typeof a==='string'){const na=a.match(/-?\d*\.?\d+/g),nb=b.match(/-?\d*\.?\d+/g);return !!(na&&nb&&na.length===nb.length&&a.replace(/-?\d*\.?\d+/g,'#')===b.replace(/-?\d*\.?\d+/g,'#')&&na.every((x,i)=>Math.abs(Number(x)-Number(nb[i]))<0.00002));}if(typeof a==='object'){const k=Object.keys(a);return k.length===Object.keys(b).length&&k.every(x=>equivalent(a[x],b[x]));}return false;}
function snapshot(root){return [...root.querySelectorAll('*')].filter(e=>!['STYLE','SCRIPT'].includes(e.tagName)).map(e=>{const c=getComputedStyle(e);return {tag:e.tagName,cls:e.getAttribute("class"),text:e.childElementCount?null:e.textContent,display:c.display,visibility:c.visibility,opacity:c.opacity,transform:c.transform==="none"?"matrix(1, 0, 0, 1, 0, 0)":c.transform,clip:c.clipPath,color:c.color,bg:c.backgroundColor,stroke:c.strokeDashoffset,path:e instanceof SVGElement&&e.tagName==='path'?e.getAttribute('d'):null,width:c.width,height:c.height};});}
function svgBoundsInViewport(e){const raw=e.getBBox(),owner=e.ownerSVGElement,local=e.getCTM(),outer=owner?.getCTM();if(!owner||!local||!outer)return raw;const matrix=outer.inverse().multiply(local);const points=[[raw.x,raw.y],[raw.x+raw.width,raw.y],[raw.x+raw.width,raw.y+raw.height],[raw.x,raw.y+raw.height]].map(([x,y])=>new DOMPoint(x,y).matrixTransform(matrix));const xs=points.map(p=>p.x),ys=points.map(p=>p.y);return {x:Math.min(...xs),y:Math.min(...ys),width:Math.max(...xs)-Math.min(...xs),height:Math.max(...ys)-Math.min(...ys)};}
function checkSvgCoordinates(){const host=document.createElement('div');host.style.cssText='position:absolute;left:-5000px;top:0';host.innerHTML='<svg width="120" height="80" viewBox="0 0 120 80"><g transform="translate(50 40)"><text font-size="14">OK</text></g><g transform="translate(-100 40)"><text font-size="14">OUT</text></g></svg>';document.body.append(host);const [inside,outside]=[...host.querySelectorAll('text')].map(svgBoundsInViewport);host.remove();return {passed:inside.x>=49&&inside.x+inside.width<120&&inside.y>0&&inside.y+inside.height<80&&outside.x+outside.width<0,inside,outside};}
function textFullyClipped(e,root){const r=e.getBoundingClientRect();let l=r.left,t=r.top,b=r.bottom,rr=r.right;for(let p=e.parentElement;p&&p!==root;p=p.parentElement){if(p.classList.contains('fx-scene'))continue;const st=getComputedStyle(p),pr=p.getBoundingClientRect();if(['hidden','clip','auto','scroll'].includes(st.overflowX)){l=Math.max(l,pr.left);rr=Math.min(rr,pr.right);}if(['hidden','clip','auto','scroll'].includes(st.overflowY)){t=Math.max(t,pr.top);b=Math.min(b,pr.bottom);}}return rr<=l||b<=t;}
function visibleTextIssues(root){const out=[];const box=root.getBoundingClientRect();for(const e of root.querySelectorAll('*')){if(e.childElementCount||!e.textContent.trim()||['STYLE','SCRIPT'].includes(e.tagName))continue;const c=getComputedStyle(e);let hidden=false;for(let p=e;p&&p!==root;p=p.parentElement){const st=getComputedStyle(p);if(st.display==='none'||st.visibility==='hidden'||Number(st.opacity)<.02){hidden=true;break;}}if(hidden||textFullyClipped(e,root))continue;const r=e.getBoundingClientRect();if(r.width>0&&r.height>0&&(r.left<box.left-4||r.right>box.right+4||r.top<box.top-4||r.bottom>box.bottom+4))out.push({text:e.textContent.slice(0,55),type:'outside-canvas'});if(e instanceof SVGElement){if((e.tagName==='text'||e.tagName==='tspan')&&e.ownerSVGElement&&typeof e.getBBox==='function'){const glyph=svgBoundsInViewport(e),v=e.ownerSVGElement.viewBox.baseVal;if(v.width>0&&(glyph.x<v.x-4||glyph.x+glyph.width>v.x+v.width+4||glyph.y<v.y-4||glyph.y+glyph.height>v.y+v.height+4))out.push({text:e.textContent.slice(0,55),type:'svg-glyph-overflow',bounds:{x:glyph.x,y:glyph.y,width:glyph.width,height:glyph.height},viewBox:{x:v.x,y:v.y,width:v.width,height:v.height}});}}else if(c.overflow==='visible'&&e.clientWidth>0&&e.scrollWidth>e.clientWidth+5)out.push({text:e.textContent.slice(0,55),type:'text-overflow'});}return out;}
function checkTextClipping(){const host=document.createElement('div');host.className='test-mount';host.innerHTML='<div class="fx-scene"><div style="position:absolute;left:100px;top:100px;width:200px;height:90px;overflow:hidden"><span style="position:absolute;left:0;top:-220px;font-size:20px">hidden-scroll-row</span><span style="position:absolute;left:0;top:20px;font-size:20px">visible-scroll-row</span></div><span style="position:absolute;left:1940px;top:150px;white-space:nowrap;font-size:20px">outside-canvas-test</span></div>';document.body.append(host);try{const issues=visibleTextIssues(host);return{passed:issues.length===1&&issues[0].text==='outside-canvas-test'&&issues[0].type==='outside-canvas',issues};}finally{host.remove();}}
document.querySelector('#run').onclick=async()=>{document.querySelector('#run').disabled=true;reports.length=0;document.querySelector('#contact').replaceChildren();await document.fonts.ready;for(const meta of UIFX.presets.filter(p=>!new URLSearchParams(location.search).has('presets')||new URLSearchParams(location.search).get('presets').split(',').includes(p.id))){let a,b;try{const ma=document.querySelector('#mount-a'),mb=document.querySelector('#mount-b');a=UIFX.mount(meta.id,ma,{});b=UIFX.mount(meta.id,mb,{});const mismatches=[];for(const fraction of [.0,.18,.49,.78,1]){const t=a.duration*fraction;a.timeline.time(t,false);const expected=snapshot(ma);b.timeline.time(b.duration,false).time(0,false).time(t,false);const actual=snapshot(mb);if(!equivalent(expected,actual))mismatches.push({fraction,diffs:expected.flatMap((v,i)=>!equivalent(v,actual[i])?[{expected:v,actual:actual[i]}]:[]).slice(0,4)});}a.timeline.time(a.duration*.8,false);const issues=visibleTextIssues(ma);const card=document.createElement('article');card.className='sample';const h=document.createElement('h2');h.textContent=meta.id;const view=document.createElement('div');view.className='sample-view';const host=document.createElement('div');host.className='sample-scene';view.append(host);card.append(h,view);document.querySelector('#contact').append(card);const scene=UIFX.mount(meta.id,host,{});scene.timeline.time(scene.duration*.8,false);new ResizeObserver(()=>host.style.transform='scale('+view.clientWidth/1920+')').observe(view);reports.push({id:meta.id,duration:a.duration,timelineDuration:a.timeline.duration(),seekConsistent:mismatches.length===0,mismatches,layoutIssues:issues});}catch(err){reports.push({id:meta.id,error:String(err.stack||err)});}finally{a?.destroy();b?.destroy();}}
window.testReport.ready=true;document.querySelector('#results').textContent=JSON.stringify({svgCoordinates:checkSvgCoordinates(),textClipping:checkTextClipping(),total:reports.length,errors:reports.filter(x=>x.error),seekFailures:reports.filter(x=>!x.seekConsistent),layoutFlags:reports.filter(x=>x.layoutIssues?.length)},null,2);document.querySelector('#run').disabled=false;};
</script></body></html>

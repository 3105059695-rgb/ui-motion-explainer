function pause(){playing=false;$('play').textContent='▶ 播放';}
function play(){if(!current||current.image)return;if(time>=current.end-1/60)time=current.start;playing=!playing;$('play').textContent=playing?'Ⅱ 暂停':'▶ 播放';last=performance.now();}
function tick(now){if(playing&&ready){time+=(Math.min(now-last,100)/1000)*speed;if(time>=current.end-1/60){if(sequence){const ix=filtered.findIndex(x=>x.id===current.id),next=filtered[(ix+1)%filtered.length];select(next);playing=true;$('play').textContent='Ⅱ 暂停';}else time=current.start;}send();}last=now;requestAnimationFrame(tick)}requestAnimationFrame(tick);
$('play').onclick=play;$('restart').onclick=()=>{time=current.start;send();};$('back').onclick=()=>{pause();time=Math.max(current.start,time-1/60);send();};$('forward').onclick=()=>{pause();time=Math.min(current.end-1/60,time+1/60);send();};$('scrub').addEventListener('input',()=>{pause();time=Number($('scrub').value);send();});$('speed').onchange=()=>speed=Number($('speed').value);$('sequence').onclick=()=>{sequence=!sequence;$('sequence').textContent=sequence?'正在连播 · 点击停止':'连播本分类';if(sequence&&!playing)play()};$('cues').onclick=e=>{const b=e.target.closest('[data-time]');if(b){pause();time=Math.min(current.end-1/60,Math.max(current.start,Number(b.dataset.time)));send();}};$('fullscreen').onclick=()=>{const v=$('viewport');if(document.fullscreenElement)document.exitFullscreen();else v.requestFullscreen?.();};document.addEventListener('fullscreenchange',fit);
document.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName))return;if(e.key==='Escape')$('modal').classList.remove('open');if(group==='files')return;if(e.code==='Space'){e.preventDefault();play()}else if(e.key==='ArrowLeft'){$('back').click();e.preventDefault()}else if(e.key==='ArrowRight'){$('forward').click();e.preventDefault()}});
function codeRows(path,start,end,hl){const lines=(D.source[path]||'此文件为二进制素材，请打开原文件。').split('\n');return lines.slice(start-1,end).map((s,i)=>`<div class="coderow ${hl&&i+start>=hl[0]&&i+start<=hl[1]?'hl':''}"><em>${i+start}</em><code>${escape(s)}</code></div>`).join('');}
function showCode(){const text=D.source[current.source];if(text===undefined){toast('此文件为原始素材，请打开文件。');return;}$('codepanel').classList.add('open');$('codename').textContent=current.source+':'+current.line;$('codebody').innerHTML=codeRows(current.source,fullCode?1:current.line,fullCode?text.split('\n').length:current.endLine,[current.line,current.endLine]);$('fullcode').textContent=fullCode?'仅看对应片段':'查看整文件';}
$('showcode').onclick=showCode;$('fullcode').onclick=()=>{fullCode=!fullCode;showCode()};$('closecode').onclick=()=>$('codepanel').classList.remove('open');$('copy').onclick=async()=>{const txt=D.source[current.source],s=fullCode?txt:txt.split('\n').slice(current.line-1,current.endLine).join('\n');try{await navigator.clipboard.writeText(s);toast('代码已复制')}catch{toast('当前浏览器不支持复制，请选择代码或打开源文件')}};
function toast(t){$('toast').textContent=t;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',2300)}
function renderFiles(){const q=$('search').value.toLowerCase(),f=D.files.filter(x=>x.path.toLowerCase().includes(q));$('filecount').textContent=f.length+' 个文件';$('filelist').innerHTML=f.map(x=>`<button class="filerow" data-file="${escape(x.path)}"><span>${escape(x.path.replace(/^source\//,''))}</span><span>${x.text?(x.lines+' 行'):((x.size/1024).toFixed(1)+' KB')}</span></button>`).join('')}
$('filelist').onclick=e=>{const b=e.target.closest('[data-file]');if(!b)return;const path=b.dataset.file;$('modal').classList.add('open');$('modalname').textContent=path;const f=D.files.find(x=>x.path===path);$('modalbody').innerHTML=f.text?codeRows(path,1,f.lines,null):`<img class="modalimage" src="${escape(path)}" alt="${escape(path)}"><p style="padding:18px"><a href="${escape(path)}" target="_blank">打开原文件 ↗</a></p>`;};$('modalclose').onclick=()=>$('modal').classList.remove('open');$('modal').onclick=e=>{if(e.target===$('modal'))$('modal').classList.remove('open')};
$('audio').addEventListener('play',()=>{pause();time=current.start;send()});$('audio').addEventListener('timeupdate',()=>{if(current?.audio){time=Math.min(current.end-1/60,$('audio').currentTime);send()}});
renderCards();const initial=D.items.find(x=>x.id===startupHash);if(initial)select(initial);window.GALLERY={select:id=>select(D.items.find(x=>x.id===id)),getState:()=>({id:current?.id,ready,time,group,count:filtered.length}),seek:t=>{pause();time=t;send()}};
})();
</script></body></html>

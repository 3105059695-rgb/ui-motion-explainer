<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><style>*{box-sizing:border-box}body{margin:0;background:#17283e;color:#eaf1ff;font-family:'Microsoft YaHei UI',sans-serif;width:1920px;height:1080px;overflow:hidden}#label{position:absolute;left:110px;top:100px;font-size:28px;color:#8da2c1;letter-spacing:3px}h1{position:absolute;left:110px;top:140px;font-size:82px;font-weight:600}canvas{position:absolute;left:110px;top:360px}#note{position:absolute;left:110px;bottom:100px;font-size:26px;color:#aabbd4}</style></head><body><div id="label">SOUND LIBRARY / 仓库代码合成</div><h1></h1><canvas width="1700" height="420"></canvas><div id="note">点击展示页的「试听」，聆听这段代码生成的声音。</div><script src="waves.js"></script><script>const key=new URLSearchParams(location.search).get('clip')||'whoosh';const wave=WAVES[key];document.querySelector('h1').textContent=wave.title+' / '+key;const ctx=document.querySelector('canvas').getContext('2d');window.renderAt=t=>{ctx.clearRect(0,0,1700,420);ctx.strokeStyle='#54708e';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(0,210);ctx.lineTo(1700,210);ctx.stroke();wave.values.forEach((v,i)=>{ctx.strokeStyle=i/320<=t/wave.duration?'#c6daff':'#5289ee';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(i*5.3,210-v*170);ctx.lineTo(i*5.3,210+v*170);ctx.stroke()});ctx.fillStyle='#ffffff';ctx.fillRect(Math.min(1698,t/wave.duration*1700),8,2,404)};window.READY=Promise.resolve();renderAt(0);</script><script src="../bridge.js"></script></body></html>

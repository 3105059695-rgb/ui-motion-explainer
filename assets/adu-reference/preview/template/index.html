<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><link rel="stylesheet" href="../../source/template/style.css"><style>
.cam{position:relative;border-radius:28px;overflow:hidden;background:#111;box-shadow:0 30px 70px rgba(0,0,0,.28)}
.cam img{width:100%;height:100%;object-fit:cover;display:block}
.cam.round{border-radius:50%;box-shadow:0 0 0 5px #fff,0 24px 50px rgba(0,0,0,.35)}
.cam.round img{object-position:50% 50%}
.cam .lab{position:absolute;left:18px;top:16px;font:400 19px ui-monospace,'PingFang SC',monospace;color:#fff;background:rgba(10,10,10,.5);padding:6px 14px;border-radius:30px;-webkit-backdrop-filter:blur(8px)}
.vt{position:relative;overflow:hidden;background:#000}
.vt img{width:100%;height:100%;object-fit:cover;display:block}
.glassD{background:rgba(20,20,20,.84);-webkit-backdrop-filter:blur(26px) saturate(1.4);border:1.5px solid rgba(255,255,255,.09);border-radius:26px;box-shadow:0 30px 80px rgba(0,0,0,.5)}
.chip{display:inline-flex;align-items:center;gap:10px;padding:8px 20px;border-radius:40px;font:600 24px -apple-system,'PingFang SC',sans-serif;white-space:nowrap}
.macwin{border-radius:16px;overflow:hidden;background:#1c1c1e;box-shadow:0 40px 100px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.08)}
.macwin .tb{height:40px;display:flex;align-items:center;gap:9px;padding:0 16px;background:#2a2a2c;color:#d8d8d8;font:500 17px -apple-system,'PingFang SC'}
.macwin .tb i{width:13px;height:13px;border-radius:50%;display:block}
.macwin .body{position:relative;overflow:hidden}
.macwin .body img{width:100%;height:100%;display:block;object-fit:cover}
.check{width:44px;height:44px;border-radius:50%;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;font:700 26px -apple-system}
</style></head><body><div id="stage"><div id="world"></div><div id="fx"></div><div id="ov" style="position:absolute;inset:0;pointer-events:none"></div></div><script src="config.js"></script><script src="../../source/template/lib.js"></script><script src="../../source/template/templates.js"></script><script src="../../source/template/scenes.js"></script><script src="../../source/template/main.js"></script><div id="extract-note" style="position:absolute;right:52px;bottom:40px;font:500 22px Microsoft YaHei,sans-serif;color:#a0b3d8;background:rgba(10,15,25,.86);padding:10px 18px;border-radius:12px;z-index:999;pointer-events:none">源码动效预览 · 人物与媒体为示意 · 无音频原片</div><script src="../bridge.js"></script></body></html>

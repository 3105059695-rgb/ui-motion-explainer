<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>剪辑组件 · 概念示意预览</title>
<link rel="stylesheet" href="editing-kit.css">
<style>
  :root{color-scheme:light}*{box-sizing:border-box}body{margin:0;background:#e7eced;color:#17242c;font-family:"Microsoft YaHei",system-ui,sans-serif}button,input{font:inherit}button{border:1px solid #bfcbce;border-radius:9px;background:#fff;padding:9px 13px;cursor:pointer}button[aria-pressed=true]{background:#174c51;color:white;border-color:#174c51}button:focus-visible,input:focus-visible{outline:3px solid #b76931;outline-offset:3px}.shell{max-width:1420px;margin:auto;padding:24px}header{display:flex;align-items:center;justify-content:space-between;gap:20px}h1{font-size:24px;margin:0}header p{font-size:13px;color:#566a73}.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0}.viewport{position:relative;width:100%;aspect-ratio:16/9;overflow:hidden;border-radius:16px;box-shadow:0 14px 40px #20353b20}#stage{position:absolute;width:1280px;height:720px;transform-origin:0 0}.controls{display:flex;gap:14px;align-items:center;margin:20px 0}#timeline{flex:1;accent-color:#174c51}.clock{font-variant-numeric:tabular-nums;min-width:110px;font-size:14px}.hint{font-size:14px;line-height:1.65;color:#51646a}.scene{position:absolute;inset:0}.eyebrow{position:absolute;left:56px;top:35px;font-size:16px;letter-spacing:2px;color:var(--uek-accent);font-weight:700}.scene h2{position:absolute;left:56px;top:63px;font-size:35px;line-height:1.2;margin:0;letter-spacing:-1px}.stage-note{position:absolute;right:44px;top:34px;font-size:14px;color:var(--uek-muted);border:1px solid var(--uek-border);padding:7px 11px;border-radius:30px;z-index:20}.caption{position:absolute;left:56px;right:56px;bottom:30px;font-size:23px;font-weight:600;line-height:1.4;z-index:15}.window{position:absolute;border:1px solid var(--uek-border);border-radius:var(--uek-radius);background:var(--uek-surface);overflow:hidden}.bar{height:44px;padding:12px 18px;background:color-mix(in srgb,var(--uek-surface),var(--uek-ink) 5%);border-bottom:1px solid var(--uek-border);font-size:15px;color:var(--uek-muted)}.dots{display:inline-flex;gap:5px;margin-right:10px}.dots i{height:6px;width:6px;background:var(--uek-muted);border-radius:50%;opacity:.55}.doc{position:absolute;padding:25px 28px}.doc h3{font-size:24px;margin:0 0 19px}.row{display:flex;align-items:center;gap:14px;min-height:52px;border-top:1px solid var(--uek-border);font-size:18px}.row b{width:105px;flex-shrink:0;font-size:16px;color:var(--uek-muted);font-weight:500}.row strong{font-weight:600}.chip{display:inline-flex;align-items:center;padding:5px 10px;border-radius:6px;background:color-mix(in srgb,var(--uek-accent),var(--uek-surface) 90%);color:var(--uek-accent);font-size:14px}.missing{color:#9c482a;background:#fff3e9}.muted{color:var(--uek-muted)}.stack-note{position:absolute;font-size:17px;color:var(--uek-muted);line-height:1.7}.packet{position:absolute;padding:18px 22px;background:var(--uek-surface);border:2px solid var(--uek-accent);border-radius:var(--uek-radius);box-shadow:var(--uek-shadow);display:flex;flex-direction:column;justify-content:center;gap:9px}.packet .id{font-size:13px;letter-spacing:1px;color:var(--uek-muted)}.packet strong{font-size:22px}.packet p{margin:0;font-size:16px;line-height:1.5;color:var(--uek-muted)}.slot{position:absolute;border:1px dashed var(--uek-border);border-radius:var(--uek-radius)}.pane-label{position:absolute;color:var(--uek-muted);font-size:16px;font-weight:600}.compare-heading{position:absolute;left:45px;top:29px;font-size:15px;color:var(--uek-accent)}.mini-label{font-size:15px}.flow-panel{position:absolute;border:1px solid var(--uek-border);border-radius:var(--uek-radius);background:var(--uek-surface)}.flow-heading{position:absolute;left:25px;top:22px;font-size:21px;font-weight:700}.flow-item{position:absolute;display:flex;align-items:center;padding:14px 15px;border:1px solid var(--uek-border);background:var(--uek-surface);border-radius:9px;font-size:17px;font-weight:600;box-shadow:0 5px 14px #17242c0d}.flow-item small{margin-left:auto;color:var(--uek-muted);font-size:12px}.check{padding:12px 16px;border-radius:30px;font-size:16px;background:var(--uek-accent);color:var(--uek-surface)}.world-label{position:absolute;left:68px;top:85px;color:var(--uek-muted);font-size:16px}.world-title{position:absolute;left:68px;top:117px;font-size:34px;font-weight:700}.nav-block{position:absolute;left:70px;top:211px;width:184px;color:var(--uek-muted);font-size:19px;line-height:2.8}.report-surface{position:absolute;background:var(--uek-surface);border:1px solid var(--uek-border);border-radius:var(--uek-radius);padding:26px}.report-surface h3{font-size:23px;margin:0 0 17px}.report-line{font-size:18px;line-height:1.7;border-top:1px solid var(--uek-border);padding:9px 0}.footer-note{font-size:12px;color:#65777d;margin-top:13px}#status{font-size:12px;min-height:18px;color:#3e6064}
</style>
</head>
<body>
<main class="shell">
<header><div><h1>剪辑机制，直接接入现有工程</h1><p>概念示意预览 · 资料很多，却遗漏关键条件 → 找到条件 → 完整简报</p></div><button id="theme">切换预览色盘</button></header>
<nav class="tabs" id="tabs" aria-label="选择剪辑机制"></nav>
<div class="viewport" id="viewport"><div id="stage" class="uek-stage" aria-label="概念示意动画"></div></div>
<div class="controls"><button id="play" aria-label="播放或暂停">播放</button><button id="restart">从头</button><input id="timeline" type="range" min="0" max="8" step="0.01" value="0" aria-label="预览时间"><output id="clock" class="clock">0.00 / 8.00 秒</output></div>
<p class="hint" id="description"></p><div id="status" role="status"></div>
<p class="footer-note">演示用色盘不代表任何账号已确认风格。无外网依赖、无音轨；最终素材、来源、口播和媒体时钟由宿主工程管理。</p>
</main>
<script src="editing-kit.js"></script><script src="demo.js"></script>
</body></html>

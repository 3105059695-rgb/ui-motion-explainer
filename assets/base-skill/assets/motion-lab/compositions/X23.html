      .h-data-row{position:absolute;left:132px;width:650px;height:60px;font-size:36px;line-height:60px}

          <div class="h-code-line"><span class="h-code-no">2</span><span>已整理,</span><span class="h-code-value">9</span></div>
          <div class="h-code-line"><span class="h-code-no">3</span><span>待核对,</span><span class="h-code-value">3</span></div>

          </div>

          <div class="h-data-row" id="h-row-3"><span class="h-row-index">3</span><span class="h-row-label">待核对</span><span class="h-row-comma">,</span><span class="h-bar-track"><span class="h-bar" id="h-bar-3"></span></span><span class="h-row-number">3</span></div>
          <div id="h-report-summary"><i id="h-summary-dot"></i><span><strong>9</strong> 项完成整理，<strong>3</strong> 项留待核对。</span></div>
        </div>
      </div>
      <div id="h-result-check"><svg viewBox="0 0 28 28" aria-hidden="true"><path d="m5 14 6 6L23 7" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
      <div id="h-bottom"><span><strong>原创示意</strong> · 仅演示数据到报告的交接，不代表真实产品业绩</span><span class="h-foot-id">X23 / OBJECT HANDOFF</span></div>
    </div>`;

  // The lifted paper intentionally crosses its original record and target label.
  mount.querySelector('#h-source-code').setAttribute('data-layout-allow-occlusion','the lifted file crosses its original record');
  mount.querySelectorAll('#h-source-code span').forEach(e=>e.setAttribute('data-layout-allow-overlap','paper crosses the source during pickup'));
  const q = (selector) => mount.querySelector(selector);
  const qa = (selector) => mount.querySelectorAll(selector);
  const tl = gsap.timeline({ paused: true });
  const travelEase = gsap.parseEase('power2.inOut');
  // Both channels use the same clock; the quadratic y term creates one continuous arc.
  const arcEase = (p) => {
    const t = travelEase(p);
    return t - 10 * t * (1 - t);
  };

  tl.addLabel('read-source', 0);
  tl.set(q('#h-object'), { x: -870, y: 24, rotation: 0, scale: 1, zIndex: 3 }, 0);
  tl.set(q('#h-source-code'), { autoAlpha: 0 }, 0);
  tl.set(qa('#h-report-rule, .h-bar'), { scaleX: 0 }, 0);
  tl.to(q('#h-file-outline'), { borderColor: '#A68ACB', duration: 0.35, ease: 'power2.out' }, 1.25);
  tl.addLabel('lift-from-source', 2.05);
  tl.to(q('#h-object'), { y: -32, duration: 0.35, ease: 'power2.inOut' }, 2.05);
  // The paper crosses the black source chrome from back to front at this exact beat.
  tl.set(q('#h-object'), { zIndex: 8 }, 2.23);
  tl.to(q('#h-source-code'), { autoAlpha: 1, duration: 0.4, ease: 'power2.out' }, 2.2);
  tl.to(q('#h-source-retained'), { opacity: 1, duration: 0.35, ease: 'power2.out' }, 2.35);
  tl.to(q('#h-route-path'), { strokeDashoffset: 0, duration: 1.05, ease: 'power2.inOut' }, 2.4);
  tl.to(q('#h-transfer-label'), { opacity: 1, duration: 0.3, ease: 'power2.out' }, 2.5);

  tl.addLabel('curved-handoff', 2.4);
  tl.to(q('#h-object'), { x: 0, duration: 1.0, ease: travelEase }, 2.4);
  tl.to(q('#h-object'), { y: 0, duration: 1.0, ease: arcEase }, 2.4);
  tl.to(q('#h-object'), { rotation: -3, duration: 0.42, ease: 'power2.inOut' }, 2.4);
  tl.to(q('#h-object'), { rotation: 0, duration: 0.58, ease: 'power2.out' }, 2.82);
  tl.to(q('#h-target'), { autoAlpha: 0, duration: 0.22, ease: 'power1.out' }, 2.68);

  tl.addLabel('file-outline-becomes-report', 3.75);
  tl.to(q('#h-paper'), { clipPath: 'inset(0px 0px 0px 0px round 24px)', borderColor: '#DAD2E5', duration: 0.75, ease: 'power3.inOut' }, 3.75);
  tl.to(q('#h-file-outline'), { opacity: 0, duration: 0.35, ease: 'power2.out' }, 3.78);
  tl.to(q('#h-file-label'), { x: -84, y: -96, duration: 0.7, ease: 'power3.inOut' }, 3.78);
  tl.to(q('#h-file-id'), { opacity: 0, duration: 0.3, ease: 'power1.out' }, 3.83);
  tl.to(qa('.h-row-index, .h-row-comma'), { opacity: 0, duration: 0.35, ease: 'power1.out' }, 3.85);
  tl.to(qa('.h-row-label'), { x: -30, duration: 0.65, ease: 'power3.inOut' }, 3.82);
  tl.to(q('#h-row-1'), { x: -84, y: 28, duration: 0.7, ease: 'power3.inOut' }, 3.8);
  tl.to(q('#h-row-2'), { x: -84, y: 52, duration: 0.7, ease: 'power3.inOut' }, 3.85);
  tl.to(q('#h-row-3'), { x: -84, y: 76, duration: 0.7, ease: 'power3.inOut' }, 3.9);
  tl.to(qa('.h-row-number'), { x: 410, duration: 0.7, ease: 'power3.inOut' }, 3.85);
  tl.to(q('#h-report-title'), { clipPath: 'inset(0% 0% 0% 0%)', duration: 0.5, ease: 'power2.out' }, 4.15);
  tl.to(q('#h-report-rule'), { scaleX: 1, duration: 0.6, ease: 'power2.out' }, 4.15);
  tl.to(q('#h-report-kicker'), { opacity: 1, duration: 0.35, ease: 'power2.out' }, 4.25);
  tl.to(q('#h-paper-accent'), { opacity: 1, duration: 0.35, ease: 'power2.out' }, 4.3);
  tl.to(qa('.h-bar-track'), { opacity: 1, duration: 0.35, stagger: 0.08, ease: 'power2.out' }, 4.35);
  tl.to(qa('.h-bar'), { scaleX: 1, duration: 0.65, stagger: 0.12, ease: 'power3.out' }, 4.5);
  tl.to(q('#h-route-path'), { opacity: 0.4, duration: 0.5, ease: 'power2.out' }, 4.4);
  tl.to(q('#h-transfer-label'), { opacity: 0, duration: 0.35, ease: 'power2.out' }, 4.6);

  tl.addLabel('report-readable', 5.45);
  tl.to(q('#h-report-summary'), { clipPath: 'inset(0% 0% 0% 0%)', duration: 0.65, ease: 'power2.out' }, 5.45);
  tl.fromTo(q('#h-result-check'), { opacity: 0, scale: 0.75 }, { opacity: 1, scale: 1, duration: 0.4, ease: 'power2.out', immediateRender: false }, 6.12);
  tl.addLabel('final-hold', 6.6);
  tl.to(q('#h-stage'), { opacity: 1, duration: 2.4, ease: 'none' }, 6.6);
  return tl;
};

 window.__timelines=window.__timelines||{};
 const master=gsap.timeline({paused:true});
 {
 const mount=document.getElementById('mount-handoff');
 const child=window.makeHandoff(gsap,mount);
 child.paused(false); master.add(child,0);
 master.set(mount,{opacity:1},0);

 master.set('#sample-id',{textContent:'X23'},0);
 master.set('#sample-name',{textContent:'遮罩接力'},0);
}
 master.fromTo('#lab-progress',{scaleX:0},{scaleX:1,duration:9,ease:'none'},0);
 // Materialize the first frame even when a viewer first asks for time(0).
 master.time(0.0001,true).time(0,true);
 window.__timelines.main=master;
 // Only the external viewer/renderer drives this registered timeline.
 </script></body></html>

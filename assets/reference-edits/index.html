<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>本期剪辑时间线</title>
<style>
@font-face{font-family:Episode;src:url("Noto.woff2")}*{box-sizing:border-box}html,body{background:#0b0b0f;color:#fff;margin:0;width:100%;height:100%;font-family:Episode,system-ui,sans-serif}main{width:100%;height:100%;display:grid;place-items:center}canvas{max-width:100%;max-height:100%;width:auto;height:auto;display:block}nav{position:fixed;inset:auto 12px 12px;display:flex;gap:10px;align-items:center;padding:8px;background:#141319eb;border-radius:8px}input{flex:1;accent-color:#d6c2ff}button{background:#d6c2ff;color:#16131d;border:0;border-radius:5px;padding:6px 14px;font:inherit}output{min-width:4.5em}#fault{position:fixed;background:#261b1d;left:5%;right:5%;top:1rem;padding:.75rem}nav[hidden],#fault:empty{display:none}html.render canvas{width:100%;height:100%;max-width:none;max-height:none}
</style>
<main><canvas aria-label="本期连续剪辑画面"></canvas></main>
<nav aria-label="播放控制"><button type="button">播放</button><input aria-label="本期播放位置" type="range" value="0" min="0" step="1"><output>0 s</output></nav><p id="fault" role="alert"></p>
<script src="motion-core.js"></script><script src="agent-editorial.js"></script><script src="shot-motion.js"></script><script src="episode.js"></script><script src="player.js"></script>
</html>

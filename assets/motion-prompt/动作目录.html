<!doctype html>
<html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>动作目录 · 口播动作库</title>
<link rel="stylesheet" href="gallery.css"><link rel="stylesheet" href="directory.css">
</head><body><main class="directory">
<header class="dir-head"><div><h1>动作目录</h1><p id="summary"></p></div>
<nav aria-label="其他入口"><a href="动作目录.md">剪辑用 Markdown</a><a class="preview-home" href="index.html">打开动作库</a></nav></header>
<section class="dir-tools" aria-label="检索动作">
<div class="dir-inputs">
  <label>查动作<input id="q" type="search" placeholder="输入编号、动作或用途，如「逐项划除」" autocomplete="off"></label>
  <label>使用形式<select id="format"><option value="">全部形式</option></select></label>
  <label>参考片<select id="film"><option value="">全部参考片</option></select></label>
</div>
<nav id="shortcuts" aria-label="快速入口"></nav>
</section>
<section id="overview" aria-labelledby="browseTitle"><h2 id="browseTitle">按剪辑任务浏览</h2><div class="dir-groups" id="groups"></div></section>
<section id="results" hidden aria-labelledby="resultTitle">
<nav id="crumb" aria-label="当前目录"></nav>
<div class="result-head"><h2 id="resultTitle"></h2><span id="total" role="status"></span><a class="result-preview" id="preview">浏览这组动态预览</a></div>
<div class="dir-drill"><label>一级分类<select id="section"></select></label><label>二级分类<select id="folder"></select></label>
<label id="relatedLabel" class="related-option"><input type="checkbox" id="related">含跨类参考</label><a id="review" hidden>原片同步连播</a></div>
<ol id="items" aria-label="当前分类的动作"></ol><p id="empty" hidden>没有匹配的动作。可以调整分类、参考片或搜索词。</p>
<button id="next" type="button" hidden></button>
</section>
<noscript><p><a href="动作目录.md">打开完整 Markdown 目录</a></p></noscript>
</main><script src="catalog.js"></script><script src="directory-model.js"></script><script src="directory.js"></script></body></html>

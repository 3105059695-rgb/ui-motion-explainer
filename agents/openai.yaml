interface:
  display_name: "我的 UI 动效剪辑"
  short_description: "通用剪辑导演＋账号风格档案：先样片确认，保留原口播，按内容选择动效与字体"
  default_prompt: "先读取本仓库 docs/broll-preferences.md 与 docs/broll-calibration-cases.md，按 AI-START.md 将增量规则保存到实际 Skill 目录；已有安装只更新规则，无需重下完整包。剪辑先分析句意、上下文和人物情绪，再定 B-roll、动作及特效。读取 AI-START.md，自动安装最新版“我的 UI 动效剪辑”；安装后使用 $ui-motion-fusion，根据口播与素材自主编排，保留原口播内容、顺序和原声，按账号风格选择画面、动效及字体。先交开头和代表性正文，确认本期风格后完成整条 MP4 与可编辑工程。"

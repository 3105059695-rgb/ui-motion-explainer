interface:
  display_name: "我的 UI 动效剪辑"
  short_description: "沿用 Fred Talk 质感，先剪出材料与事件，再配合 UI 动效和声音"
  default_prompt: "使用 $ui-motion-fusion，读取当前入口与 aesthetic-preferences.md，继承 Fred Talk 整体 UI、AE 感、开头和禁忌。通读口播，取得并查看本期材料，按原声剪出过程和结果，再配合素材取景、UI 状态变化与声音事件；缺素材不静默改成标题卡。保留原稿、原声及人物身份，内部检查修正后交付当前授权范围；仅检查 Skill 时不制作视频。"
